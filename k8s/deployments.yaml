# MedAxis — Kubernetes Deployments
# Apply: kubectl apply -f k8s/ -n medaxis
# Each service runs as a separate Deployment with its own port.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: medaxis
spec:
  replicas: 2
  selector:
    matchLabels: {app: auth-service}
  template:
    metadata:
      labels: {app: auth-service}
    spec:
      containers:
      - name: auth-service
        image: medaxis/auth-service:latest
        ports: [{containerPort: 8001}]
        envFrom:
        - configMapRef: {name: medaxis-config}
        - secretRef:    {name: medaxis-secrets}
        livenessProbe:
          httpGet: {path: /health, port: 8001}
          initialDelaySeconds: 10
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: medaxis
spec:
  selector: {app: auth-service}
  ports: [{port: 8001, targetPort: 8001}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: medaxis
spec:
  replicas: 2
  selector:
    matchLabels: {app: inventory-service}
  template:
    metadata:
      labels: {app: inventory-service}
    spec:
      containers:
      - name: inventory-service
        image: medaxis/inventory-service:latest
        ports: [{containerPort: 8002}]
        envFrom:
        - configMapRef: {name: medaxis-config}
        - secretRef:    {name: medaxis-secrets}
        livenessProbe:
          httpGet: {path: /health, port: 8002}
          initialDelaySeconds: 10
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: medaxis
spec:
  selector: {app: inventory-service}
  ports: [{port: 8002, targetPort: 8002}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: medaxis
spec:
  replicas: 2
  selector:
    matchLabels: {app: api-gateway}
  template:
    metadata:
      labels: {app: api-gateway}
    spec:
      containers:
      - name: api-gateway
        image: medaxis/api-gateway:latest
        ports: [{containerPort: 8000}]
        envFrom:
        - configMapRef: {name: medaxis-config}
        livenessProbe:
          httpGet: {path: /health, port: 8000}
          initialDelaySeconds: 5
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: medaxis
spec:
  type: LoadBalancer
  selector: {app: api-gateway}
  ports: [{port: 80, targetPort: 8000}]
