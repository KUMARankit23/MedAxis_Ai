version: "3.9"

# MedAxis Platform — Full stack
# Usage: docker compose up -d --build
# Gateway: http://localhost:8000
# Swagger: http://localhost:800{1-6}/docs

x-common-env: &common-env
  DB_HOST:     postgres
  DB_PORT:     "5432"
  DB_USER:     postgres
  DB_PASSWORD: "${DB_PASSWORD:-postgres}"
  REDIS_HOST:  redis
  REDIS_PORT:  "6379"
  JWT_SECRET:  "${JWT_SECRET:-medaxis-change-in-production}"

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD:-postgres}"
      POSTGRES_DB:       medaxis_auth
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db/01_create_databases.sql:/docker-entrypoint-initdb.d/01_create_databases.sql
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s; timeout: 5s; retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s; timeout: 3s; retries: 5

  # ── Microservices ────────────────────────────────────────────────────────────

  auth-service:
    build: {context: services/auth-service, dockerfile: Dockerfile}
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD:-postgres}@postgres:5432/medaxis_auth"
    ports: ["8001:8001"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: on-failure

  inventory-service:
    build: {context: services/inventory-service, dockerfile: Dockerfile}
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD:-postgres}@postgres:5432/medaxis_inventory"
    ports: ["8002:8002"]
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
    restart: on-failure

  billing-service:
    build: {context: services/billing-service, dockerfile: Dockerfile}
    environment:
      <<: *common-env
      DATABASE_URL:          "postgresql://postgres:${DB_PASSWORD:-postgres}@postgres:5432/medaxis_billing"
      INVENTORY_SERVICE_URL: "http://inventory-service:8002"
    ports: ["8003:8003"]
    depends_on:
      postgres:          {condition: service_healthy}
      inventory-service: {condition: service_started}
    restart: on-failure

  replenishment-service:
    build: {context: services/replenishment-service, dockerfile: Dockerfile}
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD:-postgres}@postgres:5432/medaxis_replenishment"
    ports: ["8004:8004"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: on-failure

  reporting-service:
    build: {context: services/reporting-service, dockerfile: Dockerfile}
    environment:
      <<: *common-env
      BILLING_DB_URL:   "postgresql://postgres:${DB_PASSWORD:-postgres}@postgres:5432/medaxis_billing"
      INVENTORY_DB_URL: "postgresql://postgres:${DB_PASSWORD:-postgres}@postgres:5432/medaxis_inventory"
    ports: ["8005:8005"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: on-failure

  ai-insights-service:
    build: {context: services/ai-insights-service, dockerfile: Dockerfile}
    environment:
      <<: *common-env
      DATABASE_URL:  "postgresql://postgres:${DB_PASSWORD:-postgres}@postgres:5432/medaxis_ai"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GROQ_API_KEY:   "${GROQ_API_KEY:-}"
    ports: ["8006:8006"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: on-failure

  notification-service:
    build: {context: services/notification-service, dockerfile: Dockerfile}
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD:-postgres}@postgres:5432/medaxis_notifications"
    ports: ["8007:8007"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: on-failure

  # ── API Gateway ──────────────────────────────────────────────────────────────

  api-gateway:
    build: {context: services/api-gateway, dockerfile: Dockerfile}
    environment:
      AUTH_SERVICE_URL:          "http://auth-service:8001"
      INVENTORY_SERVICE_URL:     "http://inventory-service:8002"
      BILLING_SERVICE_URL:       "http://billing-service:8003"
      REPLENISHMENT_SERVICE_URL: "http://replenishment-service:8004"
      REPORTING_SERVICE_URL:     "http://reporting-service:8005"
      AI_SERVICE_URL:            "http://ai-insights-service:8006"
      NOTIFICATION_SERVICE_URL:  "http://notification-service:8007"
    ports: ["8000:8000"]
    depends_on:
      - auth-service
      - inventory-service
      - billing-service
      - replenishment-service
      - reporting-service
      - ai-insights-service
      - notification-service
    restart: on-failure

volumes:
  postgres_data:
