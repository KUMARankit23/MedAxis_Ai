name: CI — Lint & Test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.4.4

      - name: Run ruff
        run: ruff check services/ shared/

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Install service dependencies
        run: |
          pip install -r services/auth-service/requirements.txt
          pip install -r services/inventory-service/requirements.txt
          pip install -r services/billing-service/requirements.txt

      - name: Run tests (tests/ and services/)
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          JWT_SECRET: test-secret-key-minimum-32-characters-long
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          ENVIRONMENT: test
          SENTRY_DSN: ""
          INVENTORY_SERVICE_URL: http://localhost:8002
        run: |
          pytest tests/ -v --tb=short --asyncio-mode=auto
          pytest services/ -v --tb=short --asyncio-mode=auto

  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build auth-service (smoke test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/auth-service/Dockerfile
          push: false
          tags: medaxis/auth-service:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
